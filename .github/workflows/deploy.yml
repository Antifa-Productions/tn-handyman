      - name: Post-deploy smoke test
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          sleep 15
          BASE="https://tandnhandymanvt.com"

          # Fail fast if the secret wasn't provided
          test -n "$CI_TOKEN" || { echo "::error::CI_TOKEN secret is not set"; exit 1; }

          # All requests carry the secret token so the WAF skip rule
          # lets CI traffic through. Token lives in repo secrets,
          # never in logs.
          AUTH=(-H "X-CI-Token: ${CI_TOKEN}")

          # --- Asset/MIME checks ---
          check_any() {
            url="$1"; shift
            body="/tmp/smoke_body.$$"
            out=$(curl -sS "${AUTH[@]}" -o "$body" -w "%{http_code} %{content_type}" "$url" 2>/tmp/smoke_err.$$)
            code="${out%% *}"
            ctype="${out#* }"
            ctype="${ctype%%;*}"
            echo "$url → $code ($ctype)"
            if [ "$code" = "000" ]; then
              echo "::error::curl transport failure for $url:"
              cat /tmp/smoke_err.$$
              rm -f "$body" /tmp/smoke_err.$$
              exit 1
            fi
            if grep -q "Just a moment" "$body" 2>/dev/null; then
              echo "::error::$url hit a Cloudflare challenge page — X-CI-Token was not accepted by the WAF skip rule"
              rm -f "$body" /tmp/smoke_err.$$
              exit 1
            fi
            rm -f "$body" /tmp/smoke_err.$$
            test "$code" = "200" || { echo "::error::$url returned $code"; exit 1; }
            matched=""
            for expected in "$@"; do
              test "$ctype" = "$expected" && matched=1 && break
            done
            if [ -z "$matched" ]; then
              echo "::error::$url unexpected MIME type: $ctype (allowed: $*)"
              exit 1
            fi
          }

          check_any "$BASE/"                        "text/html"
          check_any "$BASE/contact"                 "text/html"
          check_any "$BASE/css/style.css"           "text/css"
          check_any "$BASE/js/main.js"              "text/javascript" "application/javascript"
          check_any "$BASE/js/draft-store.mjs"      "text/javascript" "application/javascript"
          check_any "$BASE/sw.js"                   "text/javascript" "application/javascript"
          check_any "$BASE/workbox/workbox-sw.js"   "text/javascript" "application/javascript"
          check_any "$BASE/manifest.webmanifest"    "application/manifest+json" "application/json"
          check_any "$BASE/sitemap.xml"             "application/xml" "text/xml"
          check_any "$BASE/sw-precache.json"        "application/json" "text/plain"

          # --- Security header assertions ---
          # Use HEAD (-I): the worker now applies the full CSP (with nonce)
          # to HEAD requests as well, since the CSP header is independent
          # of the body.
          assert_header() {
            url="$1"; header="$2"; pattern="$3"
            value=$(curl -sI "${AUTH[@]}" "$url" | tr -d '\r' | awk -v h="$header:" 'tolower($1)==tolower(h){sub(/^[^ ]*[ ]*/,""); print}')
            echo "$url $header → $value"
            echo "$value" | grep -qi "$pattern" || { echo "::error::$url $header failed: '$value' (expected pattern: $pattern)"; exit 1; }
          }

          assert_header "$BASE/" "Strict-Transport-Security" "max-age=63072000.*includeSubDomains.*preload"
          assert_header "$BASE/" "Content-Security-Policy" "default-src 'none'"
          assert_header "$BASE/" "Content-Security-Policy" "form-action 'self' https://formspree.io"
          assert_header "$BASE/" "Content-Security-Policy" "script-src 'self' 'nonce-"
          assert_header "$BASE/" "Content-Security-Policy" "style-src 'self'$"
          assert_header "$BASE/" "X-Content-Type-Options" "nosniff"
          assert_header "$BASE/" "Referrer-Policy" "no-referrer"
          assert_header "$BASE/" "Permissions-Policy" "fullscreen=(self)"
          assert_header "$BASE/" "Cross-Origin-Opener-Policy" "same-origin"
          assert_header "$BASE/" "Cross-Origin-Resource-Policy" "same-origin"

          # Wildcard ACAO must be gone: no Origin sent → no ACAO at all
          acao=$(curl -sI "${AUTH[@]}" "$BASE/" | tr -d '\r' | awk 'tolower($1)=="access-control-allow-origin:"{print $2}')
          test -z "$acao" || { echo "::error::ACAO present without Origin header: $acao"; exit 1; }

          # Allowlisted origin echoes back exactly (never *)
          acao=$(curl -sI "${AUTH[@]}" -H "Origin: https://www.tandnhandymanvt.com" "$BASE/" \
                 | tr -d '\r' | awk 'tolower($1)=="access-control-allow-origin:"{sub(/^[^ ]*[ ]*/,""); print}')
          test "$acao" = "https://www.tandnhandymanvt.com" || { echo "::error::ACAO echo wrong: '$acao'"; exit 1; }

          # Foreign origin gets nothing
          acao=$(curl -sI "${AUTH[@]}" -H "Origin: https://evil.example" "$BASE/" \
                 | tr -d '\r' | awk 'tolower($1)=="access-control-allow-origin:"{sub(/^[^ ]*[ ]*/,""); print}')
          test -z "$acao" || { echo "::error::ACAO leaked for disallowed origin: $acao"; exit 1; }

          # www consolidates to apex via 301
          code=$(curl -s "${AUTH[@]}" -o /dev/null -w "%{http_code}" "https://www.tandnhandymanvt.com/")
          loc=$(curl -sI "${AUTH[@]}" "https://www.tandnhandymanvt.com/" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
          echo "www / → $code ($loc)"
          test "$code" = "301" || { echo "::error::www did not redirect: $code"; exit 1; }
          case "$loc" in https://tandnhandymanvt.com/*) ;; *) echo "::error::unexpected redirect target: $loc"; exit 1;; esac

          # 404 page works via the worker's not_found_handling
          code=$(curl -s "${AUTH[@]}" -o /dev/null -w "%{http_code}" "$BASE/nonexistent-page-test")
          echo "/nonexistent-page-test → $code"
          test "$code" = "404" || { echo "::error::expected 404, got $code"; exit 1; }
